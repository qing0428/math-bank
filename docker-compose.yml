services:
  app:
    build: .
    image: ghcr.io/qing0428/math-bank:latest
    container_name: mathbank
    ports:
      - "3080:3001"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      - DB_PATH=/data/mathbank.db
      - IMAGES_DIR=/data/images
      - PORT=3001
    restart: unless-stopped
