services:
  app:
    build: .
    image: ghcr.io/qing0428/math-bank:latest
    container_name: mathbank
    ports:
      - "3080:3001"
    volumes:
      - ${DATA_DIR:-./data}:/data
    environment:
      - DB_PATH=/data/mathbank.db
      - IMAGES_DIR=/data/images
      - PORT=3001
      # 飞书机器人（可选，取消注释并填写）
      # - FEISHU_APP_ID=your_app_id
      # - FEISHU_APP_SECRET=your_app_secret
      # - FEISHU_VERIFY_TOKEN=your_verify_token
      # 飞书机器人视觉识别 API（可选）
      # - VISION_API_BASE=https://dashscope.aliyuncs.com/api/v1/services/aigc/multimodal-generation/generation
      # - VISION_API_KEY=your_api_key
      # - VISION_MODEL=qwen-vl-max
    # ARM 设备内存限制
    mem_limit: 256m
    memswap_limit: 256m
    # 限制 CPU 使用
    cpus: 1.0
    restart: unless-stopped
